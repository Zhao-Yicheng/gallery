<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D沉浸式照片空间</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
        
        .gallery-container {
            width: 100%;
            height: 100%;
            perspective: 1500px;
            position: relative;
            background: radial-gradient(ellipse at center, #1a1a3a 0%, #0a0a1a 70%);
        }

        .space-scene {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateScene 60s linear infinite;
        }

        .space-scene.paused {
            animation-play-state: paused;
        }

        @keyframes rotateScene {
            from { transform: rotateY(0deg) rotateX(-10deg); }
            to { transform: rotateY(360deg) rotateX(-10deg); }
        }

        .stars {
            position: absolute;
            width: 2000px;
            height: 2000px;
            top: 50%;
            left: 50%;
            margin: -1000px 0 0 -1000px;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, #fff, transparent),
                radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 370px 50px, #fff, transparent),
                radial-gradient(2px 2px at 450px 200px, rgba(255,255,255,0.8), transparent);
            background-repeat: repeat;
            background-size: 500px 250px;
            transform: translateZ(-500px);
            opacity: 0.8;
        }

        .photo-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .photo-card {
            position: absolute;
            width: 180px;
            height: 135px;
            left: 50%;
            top: 50%;
            margin-left: -90px;
            margin-top: -67px;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .photo-card:hover {
            transform: scale(1.1) !important;
            z-index: 100;
        }

        .photo-card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(100, 150, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        .photo-card-inner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(100, 150, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .photo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            backface-visibility: hidden;
        }

        .photo-card.loading .photo-image {
            opacity: 0;
        }

        .photo-card.loading::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            margin: -15px 0 0 -15px;
            border: 2px solid rgba(100, 150, 255, 0.3);
            border-top-color: #6496ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 2;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .photo-fallback {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 12px;
        }

        .photo-card.loading .photo-fallback {
            display: flex;
        }

        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.8), transparent);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-20px) translateX(10px); opacity: 0.8; }
            50% { transform: translateY(0) translateX(-10px); opacity: 0.5; }
            75% { transform: translateY(20px) translateX(5px); opacity: 0.7; }
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: rgba(100, 150, 255, 0.2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-btn:hover {
            background: rgba(100, 150, 255,
